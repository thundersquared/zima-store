name: cloudflared
services:
  cloudflared:
    # renovate: datasource=docker depName=cloudflare/cloudflared
    image: cloudflare/cloudflared:2026.9.1@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ""
    networks:
      - cloudflared
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    x-casaos:
      envs:
        - container: TUNNEL_TOKEN
          description:
            en_US: Cloudflare tunnel token. Required to start the tunnel.

networks:
  cloudflared:
    driver: bridge

x-casaos:
  id: com.thundersquared.cloudflared
  main: cloudflared
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/cloudflare.svg
  title:
    en_US: Cloudflared
  tagline:
    en_US: Connect a managed Cloudflare Tunnel without opening inbound ports
  description:
    en_US: >-
      Runs the official Cloudflare cloudflared client in a bridge network. The
      tunnel token is supplied during install and is never stored in this
      repository. No host networking or inbound port is required.
  tips:
    before_install:
      en_US: >-
        Create a remotely managed tunnel in Cloudflare and provide its token
        as CLOUDFLARED_TUNNEL_TOKEN. The container exits when no token is set.
  author: thundersquared
  developer: Cloudflare
  category: Networking
  architectures:
    - amd64
    - arm64
  # renovate: datasource=docker depName=cloudflare/cloudflared
  version: "2026.9.1"
  release_notes:
    en_US: Pinned Cloudflare cloudflared 2026.9.1 manifest.
  website: https://www.cloudflare.com/products/tunnel/
  repo: https://github.com/cloudflare/cloudflared
  support: https://developers.cloudflare.com/cloudflare-one/connections/connect-networks/
  docs: https://developers.cloudflare.com/cloudflare-one/connections/connect-networks/configure-tunnels/
