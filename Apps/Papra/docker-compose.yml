name: thundersquared-papra
services:
  papra:
    # renovate: datasource=docker depName=ghcr.io/papra-hq/papra
    image: ghcr.io/papra-hq/papra:26.7.1-rootless@sha256:d1f596a35332ad04d8a69d88a5e19bc82acd47f2bc2fe687dd2145b1ef5a8b19
    user: $PUID:$PGID
    environment:
      TZ: $TZ
      APP_BASE_URL: ""
      AUTH_SECRET: ""
      AUTH_IS_REGISTRATION_ENABLED: "true"
      INGESTION_FOLDER_IS_ENABLED: "true"
      DOCUMENTS_OCR_LANGUAGES: eng
    ports:
      - target: 1221
        published: "1221"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/papra
        target: /app/app-data
      - type: bind
        source: /DATA/Media/Documents
        target: /app/app-data/documents
      - type: bind
        source: /DATA/Media/Scans
        target: /app/ingestion
      - type: bind
        source: /DATA/AppData/papra/tessdata/eng.traineddata
        target: /app/eng.traineddata
        read_only: true
    network_mode: bridge
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone used by Papra. Defaults to the host's system timezone.
        - container: APP_BASE_URL
          description:
            en_US: Required. URL used to open Papra, for example http://192.168.1.10:1221. Login fails when it does not match the browser address.
        - container: AUTH_SECRET
          description:
            en_US: Required. Random secret of at least 32 characters used to sign sessions, for example from openssl rand -hex 48. Changing it signs every user out.
        - container: AUTH_IS_REGISTRATION_ENABLED
          description:
            en_US: Allows new accounts to sign up. Create your account, then set this to false so nobody else on the network can register.
        - container: INGESTION_FOLDER_IS_ENABLED
          description:
            en_US: Watches /DATA/Media/Scans and imports files dropped into a subfolder named after a Papra organization ID, deleting each file once imported. Files at the top level are skipped.
        - container: DOCUMENTS_OCR_LANGUAGES
          description:
            en_US: 'Comma-separated Tesseract language codes used to OCR uploaded documents, most used first, for example ron,ita,eng. Mount /app/LANG.traineddata for every language listed: an unmounted language is downloaded from cdn.jsdelivr.net on every OCR run, and when that download fails Papra exits and restarts.'
      ports:
        - container: "1221"
          description:
            en_US: Papra HTTP web interface and API.
      volumes:
        - container: /app/app-data
          description:
            en_US: Persistent Papra SQLite database and configuration. Stored at /DATA/AppData/papra on the host and must be writable by PUID and PGID.
        - container: /app/app-data/documents
          description:
            en_US: Stored document files, organised by Papra organization. Stored at /DATA/Media/Documents on the host and must be writable by PUID and PGID. Manage files through Papra rather than editing them in place.
        - container: /app/ingestion
          description:
            en_US: Ingestion folder shared with scanservjs. Files in /DATA/Media/Scans/ORGANIZATION_ID are imported into that organization and then deleted; failed imports move to an ingestion-error subfolder. Each organization folder must be writable by PUID and PGID.
        - container: /app/eng.traineddata
          description:
            en_US: Optional local English OCR data, read from /DATA/AppData/papra/tessdata/eng.traineddata so OCR works without downloading it each time. Papra only reads language files from its working directory, so each language in DOCUMENTS_OCR_LANGUAGES needs its own /app/LANG.traineddata mount. A missing file falls back to downloading.

x-casaos:
  id: com.thundersquared.papra
  main: papra
  index: /
  port_map: "1221"
  scheme: http
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/papra.svg
  title:
    en_US: Papra
  tagline:
    en_US: Minimalistic document management and archiving
  description:
    en_US: >-
      Papra is a self-hosted document archive with full-text search, tags, and
      organizations. This definition uses the rootless image running as PUID
      and PGID in bridge mode on HTTP port 1221 with every Linux capability
      dropped. The SQLite database lives in /DATA/AppData/papra and document
      files in /DATA/Media/Documents. Outgoing email is disabled, so password
      resets and invitations are not delivered. The ingestion folder watches
      /DATA/Media/Scans, the scanservjs output: files placed in a subfolder
      named after a Papra organization ID are imported and then deleted.
  tips:
    before_install:
      en_US: >-
        Set APP_BASE_URL to the address you will open Papra on (for example
        http://192.168.1.10:1221) and AUTH_SECRET to a random string of at
        least 32 characters (openssl rand -hex 48). Papra refuses to start
        without a non-default secret, and login fails when APP_BASE_URL does
        not match the browser address. Papra runs as uid/gid 1000 by default;
        create /DATA/AppData/papra/db and /DATA/Media/Documents and chown
        /DATA/AppData/papra and /DATA/Media/Documents to 1000:1000 on the host
        before installing. Papra OCRs uploads in the DOCUMENTS_OCR_LANGUAGES
        languages and downloads that language data from cdn.jsdelivr.net on
        every run, because it cannot cache inside its read-only working
        directory. To keep it local, download each language once, for example
        curl -fL https://cdn.jsdelivr.net/npm/@tesseract.js-data/eng/4.0.0_best_int/eng.traineddata.gz
        | gunzip > /DATA/AppData/papra/tessdata/eng.traineddata, and add a
        read-only mount of /DATA/AppData/papra/tessdata/LANG.traineddata to
        /app/LANG.traineddata for every language besides English, which is
        already mounted. Mount every listed language: when a download fails,
        for example without Internet access, Papra exits and restarts instead
        of skipping OCR. If Docker created an empty directory in place of a
        missing file, remove it before downloading. Registration is open until
        you set AUTH_IS_REGISTRATION_ENABLED to false, so create your account
        right after installing and keep port 1221 on a trusted LAN. To import
        scans automatically, copy your organization ID from the Papra URL
        (/organizations/ID), create /DATA/Media/Scans/ID owned by 1000:1000,
        and change the scanservjs scans volume to that folder; Papra deletes
        each file after importing it. The database holds session data; treat
        backups as sensitive.
  author: thundersquared
  developer: Papra
  category: Productivity
  architectures:
    - amd64
    - arm64
  version_suffix: "-rootless"
  version: "26.7.1"
  update_at: '2026-10-22'
  release_notes:
    en_US: Pinned ghcr.io/papra-hq/papra:26.7.1-rootless at sha256:d1f596a35332.
  website: https://papra.app/
  repo: https://github.com/papra-hq/papra
  support: https://github.com/papra-hq/papra/issues
  docs: https://docs.papra.app/self-hosting/using-docker-compose/
