name: hermes-agent
services:
  gateway:
    # renovate: datasource=docker depName=nousresearch/hermes-agent
    image: nousresearch/hermes-agent:v2026.9.14@sha256:99641e57ec762c59e54cb44aa6746b7fc68c18b3c5ddb088af54234c613d9294
    command: ["gateway", "run"]
    environment:
      HERMES_UID: "10000"
      HERMES_GID: "10000"
      HERMES_HOME: /opt/data
    volumes:
      - type: bind
        source: /DATA/AppData/hermes-agent
        target: /opt/data
    networks:
      - hermes
    restart: unless-stopped
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    x-casaos:
      envs:
        - container: HERMES_UID
          description:
            en_US: UID used for files in the persistent Hermes data volume.
        - container: HERMES_GID
          description:
            en_US: GID used for files in the persistent Hermes data volume.
        - container: HERMES_HOME
          description:
            en_US: Persistent Hermes home directory inside the container.
      volumes:
        - container: /opt/data
          description:
            en_US: Persistent Hermes profiles, configuration, keys, sessions, and generated dashboard credentials. Stored at /DATA/AppData/hermes-agent on the host.

  dashboard:
    # renovate: datasource=docker depName=nousresearch/hermes-agent
    image: nousresearch/hermes-agent:v2026.9.14@sha256:99641e57ec762c59e54cb44aa6746b7fc68c18b3c5ddb088af54234c613d9294
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        creds=/opt/data/.dashboard-credentials
        if [ ! -f "$$creds" ]; then
          password="$$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')"
          secret="$$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          printf 'HERMES_DASHBOARD_BASIC_AUTH_USERNAME=zima\nHERMES_DASHBOARD_BASIC_AUTH_PASSWORD=%s\nHERMES_DASHBOARD_BASIC_AUTH_SECRET=%s\n' "$$password" "$$secret" > "$$creds"
          chmod 0600 "$$creds"
        fi
        if [ ! -f /opt/data/.dashboard-credentials-announced ]; then
          . "$$creds"
          printf 'Generated Hermes dashboard credentials once: username=%s password=%s\n' "$$HERMES_DASHBOARD_BASIC_AUTH_USERNAME" "$$HERMES_DASHBOARD_BASIC_AUTH_PASSWORD"
          : > /opt/data/.dashboard-credentials-announced
        fi
        set -a
        . "$$creds"
        set +a
        . /opt/hermes/.venv/bin/activate
        exec hermes dashboard --host 0.0.0.0 --no-open
    depends_on:
      - gateway
    environment:
      HERMES_UID: "10000"
      HERMES_GID: "10000"
      HERMES_HOME: /opt/data
    ports:
      - target: 9119
        host_ip: 127.0.0.1
        published: "9119"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/hermes-agent
        target: /opt/data
    networks:
      - hermes
    restart: unless-stopped
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    x-casaos:
      envs:
        - container: HERMES_UID
          description:
            en_US: UID used for files in the persistent Hermes data volume.
        - container: HERMES_GID
          description:
            en_US: GID used for files in the persistent Hermes data volume.
        - container: HERMES_HOME
          description:
            en_US: Persistent Hermes home directory inside the container.
        - container: HERMES_DASHBOARD_PORT
          description:
            en_US: Host loopback port for the Hermes dashboard.
      ports:
        - container: "9119"
          description:
            en_US: Dashboard port bound to host loopback only.
      volumes:
        - container: /opt/data
          description:
            en_US: Persistent Hermes profiles, configuration, keys, sessions, and generated dashboard credentials. Stored at /DATA/AppData/hermes-agent on the host.

networks:
  hermes:
    driver: bridge

x-casaos:
  id: com.thundersquared.hermes-agent
  main: dashboard
  index: /
  port_map: "9119"
  scheme: http
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/hermes-agent.png
  title:
    en_US: Hermes Agent
  tagline:
    en_US: Self-hosted AI agent gateway with loopback-only dashboard
  description:
    en_US: >-
      Hermes Agent gateway and dashboard on a dedicated bridge network. The
      default image entrypoint is preserved so s6 initialization, ownership
      reconciliation, and supervision remain active. The dashboard listens on
      the container interface but Docker publishes it only on host loopback.
      The API server, Docker socket, and host filesystem are not enabled. A
      one-time init step generates a random dashboard username and password
      and logs them once on first start; the dashboard's own auth gate
      requires them before it will accept a non-loopback bind.
  tips:
    before_install:
      en_US: >-
        Read the dashboard container's first-start logs once for the
        generated username and password, and store them in a password
        manager. Reach the dashboard with SSH port forwarding, for example
        ssh -L 9119:127.0.0.1:9119 user@zima-host. Do not change the bind to
        0.0.0.0 on the host or expose port 9119 to LAN without a reverse
        proxy. To reset the password, stop the stack, remove
        .dashboard-credentials and .dashboard-credentials-announced from
        /DATA/AppData/hermes-agent, then start it again.
  author: thundersquared
  developer: Nous Research
  category: AI
  architectures:
    - amd64
    - arm64
  # renovate: datasource=docker depName=nousresearch/hermes-agent
  version: "v2026.9.14"
  release_notes:
    en_US: Pinned Hermes Agent v2026.9.11 manifest.
  website: https://hermes-agent.nousresearch.com/
  repo: https://github.com/NousResearch/hermes-agent
  support: https://github.com/NousResearch/hermes-agent/issues
  docs: https://hermes-agent.nousresearch.com/docs/
