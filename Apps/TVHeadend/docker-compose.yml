name: tvheadend
services:
  tvheadend:
    # renovate: datasource=docker depName=lscr.io/linuxserver/tvheadend
    image: lscr.io/linuxserver/tvheadend:latest@sha256:04caf2d70776233154fff1a184647c72068b3aa1593f3576c1c9ea3a755ae18c
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: UTC
      RUN_OPTS: --nosatip
    ports:
      - target: 9981
        published: "9981"
        protocol: tcp
      - target: 9982
        published: "9982"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/tvheadend
        target: /config
      - type: bind
        source: /DATA/Recordings/tvheadend
        target: /recordings
    devices:
      - /dev/dri:/dev/dri
      - /dev/dvb:/dev/dvb
    networks:
      - tvheadend
    restart: unless-stopped
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -O - -q http://localhost:9981/ping | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Host user ID owning TVHeadend files.
        - container: PGID
          description:
            en_US: Host group ID owning TVHeadend files.
        - container: TZ
          description:
            en_US: Timezone used by TVHeadend.
        - container: RUN_OPTS
          description:
            en_US: TVHeadend arguments. Defaults to --nosatip for bridge mode; override only deliberately.
      ports:
        - container: "9981"
          description:
            en_US: TVHeadend web interface. First-run wizard is a trusted-LAN takeover surface.
        - container: "9982"
          description:
            en_US: TVHeadend HTSP server port.
      volumes:
        - container: /config
          description:
            en_US: Persistent TVHeadend configuration.
        - container: /recordings
          description:
            en_US: Persistent TV recording destination.
      devices:
        - container: /dev/dri
          description:
            en_US: GPU device for hardware video transcoding.
        - container: /dev/dvb
          description:
            en_US: DVB tuner adapters for physical TV reception.

networks:
  tvheadend:
    driver: bridge

x-casaos:
  id: com.thundersquared.tvheadend
  main: tvheadend
  index: /
  port_map: "9981"
  scheme: http
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/tvheadend.svg
  title:
    en_US: TVHeadend
  tagline:
    en_US: TV streaming and recording server
  description:
    en_US: >-
      LinuxServer TVHeadend in bridge mode with persistent configuration and
      recordings, plus GPU and DVB tuner device passthrough. The baseline omits
      privileged and host-network access. SAT>IP, HDHomeRun, and IPTV multicast
      need deliberate opt-in networking changes.
  tips:
    before_install:
      en_US: >-
        The first-run wizard controls administrative access and is a trusted-
        LAN takeover risk. Complete it only from a trusted network. Bridge
        mode intentionally does not support multicast SAT>IP or HDHomeRun.
  author: thundersquared
  developer: LinuxServer.io
  category: Media
  architectures:
    - amd64
    - arm64
  # LinuxServer publishes no tvheadend version tag, so the store assigns a
  # counter version here. Each digest change bumps the patch component, which
  # is the only update signal the ZimaOS client can compare.
  version: "1.0.0"
  update_at: "2026-09-26T10:44:25Z"
  release_notes:
    en_US: Pinned lscr.io/linuxserver/tvheadend:latest at sha256:04caf2d70776.
  website: https://www.tvheadend.org/
  repo: https://github.com/linuxserver/docker-tvheadend
  support: https://discourse.linuxserver.io/
  docs: https://docs.linuxserver.io/images/docker-tvheadend/
