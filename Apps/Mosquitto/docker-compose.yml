name: mosquitto
services:
  mosquitto-init:
    # renovate: datasource=docker depName=eclipse-mosquitto
    image: eclipse-mosquitto:2.1.2-alpine@sha256:6f8d8a947c506f8a2290ec65cd4bd2bc7cb4d43fb5f6271f861cb013e2ef9797
    entrypoint: ["/bin/sh", "-ec"]
    # Script must stay the sole element of the command list; CasaOS splits a
    # multiline command scalar into whitespace argv and only the first token
    # survives as the shell script. Shell variables are avoided so CasaOS
    # cannot interpolate them.
    command:
      - |
        umask 077
        trap 'rmdir /mosquitto/config/.init-lock 2>/dev/null || true' EXIT
        python3 - <<'PY'
        import os
        import secrets
        import subprocess
        import sys
        import time

        config_path = "/mosquitto/config/mosquitto.conf"
        passwd_path = "/mosquitto/config/passwordfile"
        announced_path = "/mosquitto/config/.credentials-announced"
        lock_path = "/mosquitto/config/.init-lock"

        while True:
            try:
                os.mkdir(lock_path)
                break
            except FileExistsError:
                time.sleep(1)

        if not os.path.exists(config_path):
            with open(config_path, "w") as config_file:
                config_file.write(
                    "listener 1883\n"
                    "allow_anonymous false\n"
                    "password_file /mosquitto/config/passwordfile\n"
                    "persistence true\n"
                    "persistence_location /mosquitto/data/\n"
                    "log_dest stdout\n"
                )

        if not os.path.exists(passwd_path):
            password = secrets.token_hex(32)
            subprocess.run(
                ["mosquitto_passwd", "-b", "-c", passwd_path, "zima", password],
                check=True,
            )
            os.chmod(passwd_path, 0o600)
            print(
                "Generated Mosquitto credentials once: username=zima password="
                + password,
                flush=True,
            )
            open(announced_path, "w").close()
        elif not os.path.exists(announced_path):
            print(
                "Mosquitto password exists but was not announced. Reset "
                "passwordfile and restart init to generate a new credential.",
                file=sys.stderr,
                flush=True,
            )
            open(announced_path, "w").close()
        PY
        tail -f /dev/null
    volumes:
      - type: bind
        source: /DATA/AppData/mosquitto/config
        target: /mosquitto/config
      - type: bind
        source: /DATA/AppData/mosquitto/data
        target: /mosquitto/data
    networks:
      - mosquitto
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    x-casaos:
      volumes:
        - container: /mosquitto/config
          description:
            en_US: Persistent generated Mosquitto configuration and password hash. Stored at /DATA/AppData/mosquitto/config on the host.
        - container: /mosquitto/data
          description:
            en_US: Persistent MQTT message database. Stored at /DATA/AppData/mosquitto/data on the host.

  mosquitto:
    # renovate: datasource=docker depName=eclipse-mosquitto
    image: eclipse-mosquitto:2.1.2-alpine@sha256:6f8d8a947c506f8a2290ec65cd4bd2bc7cb4d43fb5f6271f861cb013e2ef9797
    entrypoint: ["/bin/sh", "-ec"]
    # Config is owned by the init container; depends_on sequences container
    # starts, and restart: unless-stopped covers the sub-second race where the
    # init container has not written mosquitto.conf yet on a fresh install.
    # Executed as root so mosquitto can read the 0600 init-generated files.
    command:
      - |
        exec mosquitto -c /mosquitto/config/mosquitto.conf
    depends_on:
      mosquitto-init:
        condition: service_started
    ports:
      - target: 1883
        published: "1883"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/mosquitto/config
        target: /mosquitto/config
        read_only: true
      - type: bind
        source: /DATA/AppData/mosquitto/data
        target: /mosquitto/data
    networks:
      - mosquitto
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    x-casaos:
      ports:
        - container: "1883"
          description:
            en_US: Authenticated MQTT TCP listener.
      volumes:
        - container: /mosquitto/config
          description:
            en_US: Read-only generated configuration and password hash. Stored at /DATA/AppData/mosquitto/config on the host.
        - container: /mosquitto/data
          description:
            en_US: Persistent MQTT message database. Stored at /DATA/AppData/mosquitto/data on the host.

networks:
  mosquitto:
    driver: bridge

x-casaos:
  id: com.thundersquared.mosquitto
  main: mosquitto
  port_map: "1883"
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/mosquitto.svg
  title:
    en_US: Eclipse Mosquitto
  tagline:
    en_US: Authenticated lightweight MQTT broker
  description:
    en_US: >-
      Eclipse Mosquitto with anonymous access disabled, persistent storage,
      and a race-safe first-start helper. The helper generates a cryptographic
      password for user zima, stores only its hash, logs the plaintext once,
      and never prints it again on restart.
  tips:
    before_install:
      en_US: >-
        Read the first-start logs once and store the generated password in a
        password manager. To reset it, stop the stack, remove passwordfile and
        .credentials-announced from /DATA/AppData/mosquitto/config, then start it.
  author: thundersquared
  developer: Eclipse Mosquitto
  category: Networking
  architectures:
    - amd64
    - arm64
  # renovate: datasource=docker depName=eclipse-mosquitto
  version: "2.1.2-alpine"
  release_notes:
    en_US: Pinned Eclipse Mosquitto 2.1.2 Alpine manifest.
  website: https://mosquitto.org/
  repo: https://github.com/eclipse-mosquitto/mosquitto
  support: https://github.com/eclipse-mosquitto/mosquitto/discussions
  docs: https://mosquitto.org/documentation/
