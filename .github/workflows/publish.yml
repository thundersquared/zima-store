name: Publish GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PAGES_DOMAIN: ${{ secrets.PAGES_DOMAIN }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Require Pages domain
        run: test -n "$PAGES_DOMAIN"

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: "scripts/reconcile_versions.py"

      - name: Reconcile app versions
        run: |
          set -euo pipefail
          base="${{ github.event.before }}"
          if [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base=""
          fi
          uv run --no-project scripts/reconcile_versions.py reconcile --base "$base"

      - name: Check source versions
        run: uv run --no-project scripts/reconcile_versions.py check

      - name: Commit reconciled versions
        run: |
          if git diff --quiet; then
            echo "versions already reconciled"
            exit 0
          fi
          git -c user.name='zima-store-bot' -c user.email='zima-store-bot@users.noreply.github.com' \
            commit -am 'chore(apps): reconcile store versions'
          if ! git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main; then
            echo "::warning::could not push the reconciled versions; this build still publishes them, but main no longer records the bump. Check branch protection on main."
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build ZimaOS v2 output
        uses: IceWhaleTech/build-appstore-action@407bf02f7ca1d3d610c88c895dc28b016bdace48 # v1.1.2
        with:
          source: .
          output: dist
          base-url: https://${{ env.PAGES_DOMAIN }}
          install-system-deps: "true"

      - name: Check built store versions
        run: uv run --no-project scripts/reconcile_versions.py check-index dist/index.json

      - name: Add Pages custom domain
        run: printf '%s\n' "$PAGES_DOMAIN" > dist/CNAME

      - name: Include store catalog lists
        run: cp category-list.json recommend-list.json dist/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  verify:
    name: Verify published store
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PAGES_DOMAIN: ${{ secrets.PAGES_DOMAIN }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: "scripts/reconcile_versions.py"

      - name: Verify store and app artifacts
        run: |
          set -euo pipefail
          BASE_URL="https://${PAGES_DOMAIN}"
          if ! curl --fail --silent --show-error --location --max-time 10 "$BASE_URL/store.json" >/dev/null 2>/dev/null; then
            echo "::warning::${BASE_URL} is not reachable yet; skipping live verification until DNS is configured."
            exit 0
          fi
          for path in store.json index.json category-list.json recommend-list.json; do
            curl --fail --silent --show-error --location "$BASE_URL/$path" | jq -e . >/dev/null
          done
          curl --fail --silent --show-error --location "$BASE_URL/index.json" -o /tmp/zima-store-index.json
          uv run --no-project scripts/reconcile_versions.py check-index /tmp/zima-store-index.json
          test "$(curl --fail --silent --show-error --location "$BASE_URL/CNAME")" = "$PAGES_DOMAIN"
          curl --fail --silent --show-error --location "$BASE_URL/metadata.tar.gz" -o /tmp/metadata.tar.gz
          curl --fail --silent --show-error --location "$BASE_URL/metadata.sha256" -o /tmp/zima-store-metadata.sha256
          (cd /tmp && sha256sum -c zima-store-metadata.sha256)
