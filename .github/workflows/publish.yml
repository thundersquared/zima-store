name: Publish GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    env:
      PAGES_DOMAIN: ${{ secrets.PAGES_DOMAIN }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Require Pages domain
        run: test -n "$PAGES_DOMAIN"

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          enable-cache: true
          cache-dependency-glob: "scripts/reconcile_versions.py"

      - name: Reconcile app versions
        run: |
          set -euo pipefail
          base="${{ github.event.before }}"
          if [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base=""
          fi
          uv run --no-project scripts/reconcile_versions.py reconcile --base "$base"

      - name: Check source versions
        run: uv run --no-project scripts/reconcile_versions.py check

      # The v1 store serves main's branch archive as-is, so publishing a
      # reconciled v2 index from an unreconciled main would split the stores.
      # Stop here and let Reconcile versions commit the fix to main; that push
      # starts a fresh publish run.
      - name: Require reconciled source
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git diff
          base="${{ github.event.before }}"
          if [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base=""
          fi
          gh workflow run reconcile.yml --ref main -f base="$base" -f sha="$GITHUB_SHA"
          echo "::error::main carries unreconciled app versions; nothing was published. Reconcile versions will commit them to main and publish again."
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

      - name: Build ZimaOS v2 output
        uses: IceWhaleTech/build-appstore-action@c9bb47fad5b32d7928a07978fad68801f52e910f # v1.1.3
        with:
          source: .
          output: dist
          base-url: https://${{ env.PAGES_DOMAIN }}
          install-system-deps: "true"

      - name: Check built store versions
        run: uv run --no-project scripts/reconcile_versions.py check-index dist/index.json

      - name: Add Pages custom domain
        run: printf '%s\n' "$PAGES_DOMAIN" > dist/CNAME

      - name: Include store catalog lists
        run: cp category-list.json recommend-list.json dist/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  verify:
    name: Verify published store
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PAGES_DOMAIN: ${{ secrets.PAGES_DOMAIN }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          enable-cache: true
          cache-dependency-glob: "scripts/reconcile_versions.py"

      - name: Verify store and app artifacts
        run: |
          set -euo pipefail
          BASE_URL="https://${PAGES_DOMAIN}"
          if ! curl --fail --silent --show-error --location --max-time 10 "$BASE_URL/store.json" >/dev/null 2>/dev/null; then
            echo "::warning::${BASE_URL} is not reachable yet; skipping live verification until DNS is configured."
            exit 0
          fi
          for path in store.json index.json category-list.json recommend-list.json; do
            curl --fail --silent --show-error --location "$BASE_URL/$path" | jq -e . >/dev/null
          done
          curl --fail --silent --show-error --location "$BASE_URL/index.json" -o /tmp/zima-store-index.json
          uv run --no-project scripts/reconcile_versions.py check-index /tmp/zima-store-index.json
          test "$(curl --fail --silent --show-error --location "$BASE_URL/CNAME")" = "$PAGES_DOMAIN"
          curl --fail --silent --show-error --location "$BASE_URL/metadata.tar.gz" -o /tmp/metadata.tar.gz
          curl --fail --silent --show-error --location "$BASE_URL/metadata.sha256" -o /tmp/zima-store-metadata.sha256
          (cd /tmp && sha256sum -c zima-store-metadata.sha256)
